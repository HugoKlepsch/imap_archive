version: '3.8'

services:
  dovecot:
    image: dovecot/dovecot:latest
    container_name: dovecot
    restart: unless-stopped
    ports:
      - "31143:31143"   # IMAP
      - "31993:31993"   # IMAPS
      - "31080:8080"    # admin ui
        # - "9090:9090"   # metrics
    volumes:
      - ${dovecot_dir}/srv/vmail:/srv/vmail
      - ${dovecot_dir}/conf:/etc/dovecot/conf.d:ro
    environment:
      - DOVECOT_HOSTNAME=${dovecot_hostname}
    networks:
      - email-net

  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ${roundcube_dir}/config:/var/roundcube/config
      - ${roundcube_dir}/logs:/var/logs
      - ${roundcube_db_dir}/db:/var/roundcube/db
    environment:
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
      - ROUNDCUBEMAIL_DB_NAME=roundcubemaildb
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://dovecot
      - ROUNDCUBEMAIL_DEFAULT_PORT=31993
      - ROUNDCUBEMAIL_SMTP_SERVER=ssl://dovecot
      - ROUNDCUBEMAIL_SMTP_PORT=31465
    depends_on:
      - dovecot
    networks:
      - email-net

networks:
  email-net:
    driver: bridge
