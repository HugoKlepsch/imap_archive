# Dovecot 2.4 configuration for the Gmail archive.
#
# This file is mounted into /etc/dovecot/conf.d/, which the image's
# dovecot.conf pulls in via `!include_try conf.d/*.conf` AFTER its own
# settings - so everything here overrides the image defaults.
#
# NOTE: we mount our own conf.d over the image's, which means the image's
# stock conf.d/auth.conf (a demo `passdb static` reading $USER_PASSWORD) is
# replaced. That is deliberate: the real passdb is defined below. Forgetting
# this is what left the first attempt at this stack with no way to log in.

# Archive only. No submission, no LMTP, no sieve - nothing here ever sends
# or receives mail directly; mbsync writes messages in over the filesystem.
protocols = imap

########################################
# On-disk layout
########################################
# Dovecot 2.4 defaults to `index`, which keeps the folder list inside a
# Dovecot index file. Two problems for us: mbsync cannot create folders in
# it, and it is not readable by anything that is not Dovecot. `fs` gives a
# plain directory tree - one directory per folder, one file per message -
# which is the format we want to still be able to open in 2045.
mailbox_list_layout = fs
mail_driver = maildir
mail_home = /srv/vmail/%{user | lower}
mail_path = ~/mail

########################################
# Index/control/volatile on LOCAL disk
########################################
# The single most important block in this file.
#
# Mail lives on the CIFS-mounted NAS. Dovecot's index, control and volatile
# files use fcntl locking and mmap semantics that SMB does not implement
# correctly; leaving them on the share is a well-known route to silently
# corrupted mailboxes. These paths point at container-local storage backed
# by the host's local disk.
#
# All three are rebuildable from the Maildir if lost, but losing
# mail_control_path (which holds dovecot-uidlist, the UID<->filename map)
# makes every client re-download the whole archive. They are included in
# backups for that reason - see docs/backup-restore.md.
mail_index_path = /srv/index/%{user | lower}
mail_control_path = /srv/control/%{user | lower}
mail_volatile_path = /srv/volatile/%{user | lower}

########################################
# Authentication
########################################
# One user. The passwd-file is generated from .env.bash by
# scripts/gen-secrets.sh - it is never committed.
# Empty uid/gid/home fields fall back to mail_uid/mail_gid/mail_home above.
passdb passwd-file {
  passwd_file_path = /etc/dovecot/generated/users
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/generated/users
}

auth_mechanisms = plain login
# Refuse cleartext credentials on unencrypted connections. Thunderbird uses
# IMAPS; Roundcube reaches Dovecot over TLS using the network alias set in
# the compose file, so the real certificate validates there too.
auth_allow_cleartext = no

########################################
# TLS
########################################
# Written by the lego container (see compose/dovecot/), renewed on a systemd
# timer, and reloaded into Dovecot by imap-archive-cert-reload.service.
ssl_server {
  cert_file = /etc/dovecot/certs/tls.crt
  key_file = /etc/dovecot/certs/tls.key
}
ssl_min_protocol = TLSv1.2

########################################
# Read-only archive (ACL)
########################################
# Clients get lookup + read + \Seen, and nothing else. No delete, no expunge,
# no folder creation. After the originals are removed from Gmail this is the
# only copy of the mail, and a stray drag in Thunderbird should not be able
# to destroy it.
#
# This restricts IMAP clients only. mbsync writes messages in through the
# filesystem and is unaffected, which is exactly the intent.
mail_plugins {
  acl = yes
}
acl_driver = vfile
acl_global_path = /etc/dovecot/acl-global
acl_globals_only = yes

########################################
# Full-text search
########################################
# fts_flatcurve is enabled by default in this image and is genuinely useful
# on an archive this size - it is what makes "find that 2016 receipt" work in
# both Thunderbird and Roundcube. Its index follows mail_index_path above, so
# it is already on local disk.
fts_autoindex = yes

########################################
# Admin API
########################################
# doveadm's HTTP listener defaults to the password "supersecret". The port is
# deliberately NOT published in the compose file, but set a real password
# anyway rather than relying solely on that.
doveadm_password = %{env:DOVEADM_PASSWORD}
